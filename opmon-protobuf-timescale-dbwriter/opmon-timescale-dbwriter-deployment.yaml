apiVersion: v1
kind: Namespace
metadata:
  annotations:
    kluctl.io/skip-delete-if-tags: "true"
  labels:
    pod-security.kubernetes.io/audit: restricted
    pod-security.kubernetes.io/audit-version: latest
    pod-security.kubernetes.io/enforce: restricted
    pod-security.kubernetes.io/enforce-version: latest
    pod-security.kubernetes.io/warn: restricted
    pod-security.kubernetes.io/warn-version: latest
  name: opmon
---
apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    app.kubernetes.io/app: opmon-protobuf-timescale-dbwriter
    app.kubernetes.io/name: opmon-protobuf-timescale-dbwriter
    app.kubernetes.io/component: opmon-protobuf-timescale-dbwriter
  name: opmonstream-dbwriter
  namespace: opmon
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/app: opmon-protobuf-timescale-dbwriter
      app.kubernetes.io/name: opmon-protobuf-timescale-dbwriter
      app.kubernetes.io/component: opmon-protobuf-timescale-dbwriter
  template:
    metadata:
      labels:
        app.kubernetes.io/app: opmon-protobuf-timescale-dbwriter
        app.kubernetes.io/name: opmon-protobuf-timescale-dbwriter
        app.kubernetes.io/component: opmon-protobuf-timescale-dbwriter
    spec:
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
              - matchExpressions:
                  - key: node-role.kubernetes.io/worker
                    operator: Exists
      automountServiceAccountToken: false
      hostUsers: false
      containers:
        - image: ghcr.io/dune-daq/microservices:mroda-opmon_protobuf ## TBC
          imagePullPolicy: Always
          name: opmon-protobuf-timescale-dbwriter
          ports:
            - containerPort: 8080
              protocol: TCP
              name: health
          env:
            - name: MICROSERVICE
              value: opmon-protobuf-timescale-dbwriter
            - name: OPMON_DBWRITER_KAFKA_BOOTSTRAP_SERVER
              value: dune-daq.kafka.svc.cluster.local:9092
            - name: OPMON_DBWRITER_KAFKA_GROUP
              value: opmon-protobuf-timescale-dbwriter
            - name: OPMON_DBWRITER_SUBSCRIBER_TIMEOUT_MS
              value: "5000"
            - name: OPMON_DBWRITER_BATCH_SIZE_MS
              value: "800"
            - name: OPMON_DBWRITER_TOPIC
              value: opmon_stream
            - name: DATABASE_URI
              valueFrom:
                secretKeyRef:
                  key: uri
                  name: timescaledb-readwrite-password
            - name: HEALTH_PORT
              value: "8080"
          resources:
            limits:
              memory: 1Gi
            requests:
              cpu: 100m
              memory: 64Mi
          securityContext:
            runAsUser: 11000
            runAsGroup: 11000
            runAsNonRoot: true
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            seccompProfile:
              type: RuntimeDefault
            capabilities:
              drop:
                - ALL
          volumeMounts:
            - name: tmp-volume
              mountPath: /tmp
          startupProbe:
            httpGet:
              path: /ready
              port: health
            initialDelaySeconds: 15
            periodSeconds: 20
            timeoutSeconds: 5
            failureThreshold: 6
          livenessProbe:
            httpGet:
              path: /live
              port: health
            initialDelaySeconds: 60
            periodSeconds: 30
            timeoutSeconds: 10
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /ready
              port: health
            initialDelaySeconds: 5
            periodSeconds: 5
            timeoutSeconds: 5
            failureThreshold: 3
      volumes:
        - name: tmp-volume
          emptyDir:
            sizeLimit: 256Mi
      securityContext:
        fsGroup: 11000
