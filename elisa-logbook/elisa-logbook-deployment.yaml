apiVersion: v1
kind: Namespace
metadata:
  annotations:
    kluctl.io/skip-delete-if-tags: "true"
  labels:
    pod-security.kubernetes.io/audit: restricted
    pod-security.kubernetes.io/audit-version: latest
    pod-security.kubernetes.io/enforce: restricted
    pod-security.kubernetes.io/enforce-version: latest
    pod-security.kubernetes.io/warn: restricted
    pod-security.kubernetes.io/warn-version: latest
  name: elisa-logbook
---
# You must still create the required secret
apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    app.kubernetes.io/app: elisa-logbook
    app.kubernetes.io/name: elisa-logbook
    app.kubernetes.io/component: elisa-logbook
  name: elisa-logbook
  namespace: elisa-logbook
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/app: elisa-logbook
      app.kubernetes.io/name: elisa-logbook
      app.kubernetes.io/component: elisa-logbook
  template:
    metadata:
      labels:
        app.kubernetes.io/app: elisa-logbook
        app.kubernetes.io/name: elisa-logbook
        app.kubernetes.io/component: elisa-logbook
    spec:
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
              - matchExpressions:
                  - key: node-role.kubernetes.io/worker
                    operator: Exists
      automountServiceAccountToken: false
      hostUsers: false
      containers:
        - image: ghcr.io/dune-daq/microservices:latest
          name: elisa-logbook
          env:
            - name: MICROSERVICE
              value: elisa-logbook
            - name: HARDWARE
              valueFrom:
                secretKeyRef:
                  key: hardware
                  name: elisa-logbook-secret
            - name: USERNAME
              valueFrom:
                secretKeyRef:
                  key: username
                  name: elisa-logbook-secret
            - name: PASSWORD
              valueFrom:
                secretKeyRef:
                  key: password
                  name: elisa-logbook-secret
            - name: APP_DATA
              value: /opt/data
          resources:
            limits:
              memory: 1Gi
            requests:
              cpu: 100m
              memory: 64Mi
          securityContext:
            runAsUser: 11000
            runAsGroup: 11000
            runAsNonRoot: true
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            seccompProfile:
              type: RuntimeDefault
            capabilities:
              drop:
                - ALL
          volumeMounts:
            - mountPath: /opt/data
              name: data-volume
            - name: tmp-volume
              mountPath: /tmp
      volumes: # persistence is not required at this time
        - name: data-volume
          emptyDir:
            sizeLimit: 10Gi
        - name: tmp-volume
          emptyDir:
            sizeLimit: 256Mi
      securityContext:
        fsGroup: 11000
