apiVersion: v1
kind: Namespace
metadata:
  annotations:
    kluctl.io/skip-delete-if-tags: "true"
  labels:
    pod-security.kubernetes.io/audit: restricted
    pod-security.kubernetes.io/audit-version: latest
    pod-security.kubernetes.io/enforce: restricted
    pod-security.kubernetes.io/enforce-version: latest
    pod-security.kubernetes.io/warn: restricted
    pod-security.kubernetes.io/warn-version: latest
  name: runservices
---
# You must still deploy postgresql with its manifests from upstream
# You must still create the required secret
apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    app.kubernetes.io/app: runregistry-rest
    app.kubernetes.io/name: runregistry-rest
    app.kubernetes.io/component: runregistry-rest
  name: runregistry-rest
  namespace: runservices
spec:
  selector:
    matchLabels:
      app.kubernetes.io/app: runregistry-rest
      app.kubernetes.io/name: runregistry-rest
      app.kubernetes.io/component: runregistry-rest
  template:
    metadata:
      labels:
        app.kubernetes.io/app: runregistry-rest
        app.kubernetes.io/name: runregistry-rest
        app.kubernetes.io/component: runregistry-rest
    spec:
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
              - matchExpressions:
                  - key: node-role.kubernetes.io/worker
                    operator: Exists
      automountServiceAccountToken: false
      hostUsers: false
      containers:
        - image: ghcr.io/dune-daq/microservices:latest
          imagePullPolicy: Always
          name: runregistry-rest
          env:
            - name: MICROSERVICE
              value: runregistry-rest
            - name: APP_DATA
              value: /opt/data
            - name: DATABASE_URI
              valueFrom:
                secretKeyRef:
                  key: uri
                  name: runservices-postgresql-svcbind-custom-user
          ports:
            - containerPort: 5005
              protocol: TCP
              name: http
          resources:
            limits:
              memory: 1Gi
            requests:
              cpu: 100m
              memory: 64Mi
          terminationMessagePath: /dev/termination-log
          terminationMessagePolicy: File
          securityContext:
            runAsUser: 11000
            runAsGroup: 11000
            runAsNonRoot: true
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            seccompProfile:
              type: RuntimeDefault
            capabilities:
              drop:
                - ALL
          volumeMounts:
            - mountPath: /opt/data
              name: data-volume
            - name: tmp-volume
              mountPath: /tmp
      volumes: # persistence is not required at this time
        - name: data-volume
          emptyDir:
            sizeLimit: 10Gi
        - name: tmp-volume
          emptyDir:
            sizeLimit: 256Mi
      securityContext:
        fsGroup: 11000
---
apiVersion: v1
kind: Service
metadata:
  labels:
    app.kubernetes.io/app: runregistry-rest
    app.kubernetes.io/name: runregistry-rest
    app.kubernetes.io/component: runregistry-rest
  name: runregistry-rest
  namespace: runservices
spec:
  ports:
    - name: http
      port: 5005
      protocol: TCP
      targetPort: http
  selector:
    app.kubernetes.io/app: runregistry-rest
    app.kubernetes.io/name: runregistry-rest
    app.kubernetes.io/component: runregistry-rest
  type: ClusterIP
