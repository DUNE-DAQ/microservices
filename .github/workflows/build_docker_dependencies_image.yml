name: Build microservices dependencies docker image

on:
  push:
    branches:
      - develop
    tags:
      - 'v*'
    paths:
      - dockerfiles/microservices-dependencies.dockerfile
  pull_request:
    types: [closed]
    branches:
      - develop
      
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          repository: DUNE-DAQ/microservices
          path: microservices 

      - name: Log in to the Container registry        
        uses: docker/login-action@v2
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      
      - name: Extract metadata (tags, labels) for Docker
        id: meta
        uses: docker/metadata-action@v4
        with:
          images: |
            ghcr.io/DUNE-DAQ/microservices_dependencies
          tags: |
            type=raw,value=latest
            type=ref,event=branch
            type=ref,event=tag
        
      - name: Build and push Docker images
        uses: docker/build-push-action@v3
        with:
          context: ${{ github.workspace }}/microservices/
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
